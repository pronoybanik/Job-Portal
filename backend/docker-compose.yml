services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: job-portal-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

  redis:
    image: redis:7-alpine
    container_name: job-portal-redis
    restart: unless-stopped
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  auth:
    build:
      context: ./auth
    container_name: job-portal-auth
    env_file:
      - ./auth/.env
    restart: unless-stopped
    depends_on:
      user:
        condition: service_started
      utils:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      USER_SERVICE_URL: http://user:5002
      UPLOAD_SERVICE: http://utils:5001
    ports:
      - "${AUTH_HOST_PORT:-5021}:5000"

  utils:
    build:
      context: ./utils
    container_name: job-portal-utils
    env_file:
      - ./utils/.env
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
    ports:
      - "${UTILS_HOST_PORT:-5022}:5001"

  user:
    build:
      context: ./user
    container_name: job-portal-user
    env_file:
      - ./user/.env
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5002
      AUTH_SERVICE_URL: http://auth:5000
      UPLOAD_SERVICE: http://utils:5001
    ports:
      - "${USER_HOST_PORT:-5023}:5002"

  job:
    build:
      context: ./job
    container_name: job-portal-job
    restart: unless-stopped
    env_file:
      - ./job/.env
    depends_on:
      kafka:
        condition: service_started
      utils:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5003
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: job-service
      KAFKA_JOB_TOPIC: job-events
      UPLOAD_SERVICE: http://utils:5001
    ports:
      - "${JOB_HOST_PORT:-5024}:5003"

  gateway:
    build:
      context: ./geteway
    container_name: job-portal-gateway
    restart: unless-stopped
    depends_on:
      - auth
      - utils
      - user
      - job
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth:5000
      UTILS_SERVICE_URL: http://utils:5001
      USER_SERVICE_URL: http://user:5002
      JOB_SERVICE_URL: http://job:5003
    ports:
      - "${GATEWAY_HOST_PORT:-3000}:3000"

volumes:
  redis-data:
